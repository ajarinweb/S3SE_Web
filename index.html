<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3SE Web Editor v1.4 (No Scroll Mobile)</title>
    <style>
        /* --- 1. SETTING WARNA & TEMA --- */
        :root {
            --primary: #0078d4;
            --bg: #f3f4f6;
            --bg-panel: #ffffff;
            --text: #374151;
            --border: #e5e7eb;
            --th-bg: #f9fafb;
            --guid-bg: #f9fafb;
            --hover-row: #f0f9ff;
        }

        [data-theme="dark"] {
            --primary: #4dabf5;
            --bg: #121212;
            --bg-panel: #1e1e1e;
            --text: #e0e0e0;
            --border: #333333;
            --th-bg: #252525;
            --guid-bg: #252525;
            --hover-row: #2a2a2a;
        }

        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); color: var(--text);
            margin: 0; padding: 0; height: 100vh; 
            display: flex; flex-direction: column;
            transition: background 0.2s, color 0.2s;
        }

        /* --- LAYOUT UTAMA --- */
        .container { display: flex; flex: 1; overflow: hidden; height: 100%; position: relative; }
        
        /* --- SIDEBAR --- */
        .sidebar { 
            width: 280px; 
            min-width: 280px; 
            background: var(--bg-panel); 
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 15px; padding: 20px;
            overflow-y: auto; z-index: 50;
            
            /* PC: Selalu Terbuka */
            position: relative;
            transform: none;
            transition: transform 0.3s ease;
        }
        
        .close-sidebar-btn { display: none; background: none; border: none; font-size: 24px; color: var(--text); cursor: pointer; margin-left: auto; }

        .main { 
            flex: 1; display: flex; flex-direction: column; 
            background: var(--bg-panel); overflow: hidden; position: relative; width: 100%;
        }

        /* --- TOOLBAR --- */
        .toolbar { 
            padding: 10px 20px; border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; gap: 12px; background: var(--bg-panel);
            flex-wrap: wrap; z-index: 40;
        }

        .menu-btn { display: none; background: none; border: none; font-size: 24px; color: var(--text); cursor: pointer; padding: 0 10px 0 0; }

        .theme-btn { 
            background: none; border: 1px solid var(--border); border-radius: 50%; 
            width: 32px; height: 32px; font-size: 16px; margin-left: auto; 
            color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .theme-btn:hover { background: var(--th-bg); }

        /* UI ASLI v1.2 */
        .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        h3 { margin: 0; font-size: 13px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }

        .drop-box { 
            border: 2px dashed #d1d5db; padding: 20px 10px; text-align: center; 
            border-radius: 6px; cursor: pointer; font-size: 13px; color: #6b7280; 
            transition: 0.2s; background: var(--th-bg);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 230px;
        }
        .drop-box:hover, .drop-box.dragover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }
        .drop-box.filled { background: rgba(0, 120, 212, 0.1); border-style: solid; border-color: var(--primary); color: var(--primary); font-weight: 500; }

        /* --- TABLE STYLE (REVISI NO SCROLL) --- */
        .grid-wrapper { flex: 1; overflow: auto; position: relative; }
        
        table { 
            width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; 
            /* HAPUS MIN-WIDTH AGAR TIDAK SCROLL DI HP */
        }
        
        thead th { 
            position: sticky; top: 0; background: var(--th-bg); 
            border-bottom: 2px solid var(--border); text-align: left; 
            padding: 12px; color: var(--text); z-index: 10; font-weight: 600;
        }
        
        /* LEBAR KOLOM (DEFAULT PC) */
        .col-guid { width: 160px; }
        .col-source { width: 40%; } 
        .col-target { width: auto; } 

        td { border-bottom: 1px solid var(--border); vertical-align: top; padding: 0; height: 1px; }
        
        .cell-guid { 
            padding: 12px; font-family: 'Consolas', monospace; color: #9ca3af; 
            font-size: 12px; background: var(--guid-bg); user-select: all; 
            word-break: break-all; /* Agar ID panjang turun ke bawah */
            height: 100%;
        }
        
        .cell-source { 
            padding: 12px; color: var(--text); background: var(--bg-panel); 
            white-space: pre-wrap; word-wrap: break-word; /* Agar teks panjang turun ke bawah */
            border-right: 1px solid var(--border);
            line-height: 1.5; height: 100%;
        }
        
        .cell-target { padding: 0; height: 100%; background: var(--bg-panel); }

        textarea.edit-box { 
            width: 100%; height: 100%; min-height: 100%;
            border: none; padding: 12px; 
            font-family: inherit; font-size: 14px; line-height: 1.5;
            resize: none; display: block; background: transparent; color: var(--text);
            outline: none; overflow: hidden; box-sizing: border-box;
            word-wrap: break-word; /* Agar teks edit turun ke bawah */
        }
        textarea.edit-box:focus { background: rgba(0, 120, 212, 0.05); box-shadow: inset 4px 0 0 var(--primary); }

        /* BUTTONS */
        .btn { padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; border: 1px solid #d1d5db; background: var(--bg-panel); color: var(--text); }
        .btn:hover { background: var(--bg); }
        .btn-primary { background: var(--primary); color: white; border: none; }
        
        .search-box { 
            padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; 
            width: 250px; font-size: 13px; outline: none; background: var(--bg-panel); color: var(--text);
        }
        .search-box:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(0,120,212,0.1); }

        .pagination { padding: 10px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); font-size: 13px; color: #6b7280; }

        #loading { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; font-weight: 500; color: #333; }
        [data-theme="dark"] #loading { background: rgba(0,0,0,0.8); color: #fff; }
        
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 45; }

        /* --- RESPONSIVE MOBILE (Max 900px) --- */
        @media (max-width: 900px) {
            /* 1. SIDEBAR (Off-Canvas) */
            .sidebar {
                position: fixed; top: 0; bottom: 0; left: 0;
                transform: translateX(-100%);
                box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            }
            .sidebar.active { transform: translateX(0); }
            
            /* 2. UI Logic */
            .menu-btn { display: block; }
            .close-sidebar-btn { display: block; }
            #overlay.active { display: block; }
            .search-box { width: 140px; }
            .toolbar { padding: 10px; }

            /* 3. TABEL HP (NO SCROLL, FIT SCREEN) */
            /* Kita atur ulang lebar kolom agar muat di layar kecil */
            .col-guid { width: 20%; }   /* ID Sempit */
            .col-source { width: 40%; } /* Sumber Sedang */
            .col-target { width: 40%; } /* Target Sedang */
            
            /* Kecilkan padding/font sedikit di HP jika perlu */
            thead th { padding: 8px; font-size: 12px; }
            .cell-guid, .cell-source, textarea.edit-box { padding: 8px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div id="loading">
    <div style="width: 40px; height: 40px; border: 4px solid #ccc; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
    <div>Memproses Data...</div>
</div>
<style>@keyframes spin { 100% { transform: rotate(360deg); } }</style>

<div id="overlay" onclick="toggleMenu()"></div>

<div class="container">
    <div class="sidebar" id="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h2 style="margin:0; font-size:18px;">S3SE Web</h2>
            <button class="close-sidebar-btn" onclick="toggleMenu()">&times;</button>
        </div>

        <div class="card">
            <h3>1. File Sumber (Source)</h3>
            <div class="drop-box" id="dropSrc" onclick="document.getElementById('fileSrc').click()" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'source')" title="Klik untuk upload">
                Upload STBL Asli
            </div>
            <input type="file" id="fileSrc" hidden accept=".stbl" onchange="loadFile('source', this.files[0])">
        </div>

        <div class="card">
            <h3>2. File Terjemahan (Target)</h3>
            <div class="drop-box" id="dropTgt" onclick="document.getElementById('fileTgt').click()" ondragover="handleDragOver(event)" ondrop="handleDrop(event, 'target')" title="Klik untuk upload">
                Upload STBL Target
            </div>
            <input type="file" id="fileTgt" hidden accept=".stbl" onchange="loadFile('target', this.files[0])">
        </div>

        <div class="card" style="margin-top:auto">
            <h3>Status</h3>
            <div id="infoText" style="font-size:12px; color:#6b7280;">Siap digunakan.</div>
        </div>
    </div>

    <div class="main">
        <div class="toolbar">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <button class="btn btn-primary" onclick="saveTargetFile()">💾 Simpan .STBL</button>
            <div style="flex:1"></div>
            <input type="text" class="search-box" id="searchInput" placeholder="Cari teks (Ctrl+F)..." onkeyup="handleSearch()">
            <button class="theme-btn" onclick="toggleTheme()" title="Mode Gelap/Terang">🌙</button>
        </div>
        
        <div class="grid-wrapper" id="gridContainer">
            <table id="grid">
                <thead>
                    <tr>
                        <th class="col-guid">Instance GUID</th>
                        <th class="col-source">Teks Sumber</th>
                        <th class="col-target">Terjemahan</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <div class="pagination">
            <button class="btn" onclick="changePage(-1)" id="btnPrev">❮ Sebelumnya</button>
            <span id="pageInfo">Halaman 1</span>
            <button class="btn" onclick="changePage(1)" id="btnNext">Berikutnya ❯</button>
        </div>
    </div>
</div>

<script>
    // --- TEMA & UI ---
    if(localStorage.getItem('theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.querySelector('.theme-btn').innerText = '☀️';
    }

    function toggleTheme() {
        const b = document.body;
        const btn = document.querySelector('.theme-btn');
        if (b.getAttribute('data-theme') === 'dark') {
            b.removeAttribute('data-theme');
            btn.innerText = '🌙';
            localStorage.setItem('theme', 'light');
        } else {
            b.setAttribute('data-theme', 'dark');
            btn.innerText = '☀️';
            localStorage.setItem('theme', 'dark');
        }
    }

    function toggleMenu() {
        if (window.innerWidth <= 900) {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }
    }

    // --- LOGIC V1.2 ---
    let allData = [];      
    let filteredData = []; 
    let currentPage = 1;
    const ITEMS_PER_PAGE = 50; 

    function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
    function handleDragOver(e) { e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.add('dragover'); }
    function handleDrop(e, type) {
        e.preventDefault(); e.stopPropagation(); e.currentTarget.classList.remove('dragover');
        if(e.dataTransfer.files.length > 0) loadFile(type, e.dataTransfer.files[0]);
    }

    function parseSTBL(buffer) {
        const view = new DataView(buffer); const decoder = new TextDecoder("utf-16le");
        try { if (new TextDecoder().decode(buffer.slice(0, 4)) !== "STBL") throw new Error("Format Invalid"); } catch(e) { throw new Error("Bukan file STBL yang valid."); }
        const count = view.getUint32(7, true); let offset = 17; let entries = [];
        for(let i=0; i<count; i++) {
            if(offset >= buffer.byteLength) break;
            const keyBig = view.getBigUint64(offset, true); offset += 8;
            const keyHex = "0x" + keyBig.toString(16).toUpperCase().padStart(16, '0');
            const len = view.getUint32(offset, true); offset += 4;
            const strBytes = buffer.slice(offset, offset + (len*2));
            const str = decoder.decode(strBytes); offset += (len*2);
            entries.push({ keyBig, keyHex, str });
        } return entries;
    }

    async function loadFile(type, file) {
        if(!file) return; showLoading(true);
        setTimeout(async () => {
            try {
                const buf = await file.arrayBuffer(); const entries = parseSTBL(buf);
                if (type === 'source') {
                    if (allData.length === 0) allData = entries.map(e => ({ ...e, sourceStr: e.str, targetStr: "" }));
                    else entries.forEach(src => {
                        const exist = allData.find(r => r.keyBig === src.keyBig);
                        if(exist) exist.sourceStr = src.str; else allData.push({ ...src, sourceStr: src.str, targetStr: "" });
                    });
                    const dz = document.getElementById('dropSrc'); dz.classList.add('filled'); dz.innerText = file.name; dz.title = file.name;
                    if(window.innerWidth <= 900) toggleMenu();
                } else {
                    if (allData.length === 0) allData = entries.map(e => ({ ...e, sourceStr: "", targetStr: e.str }));
                    else entries.forEach(tgt => {
                        const exist = allData.find(r => r.keyBig === tgt.keyBig);
                        if(exist) exist.targetStr = tgt.str; else allData.push({ ...tgt, sourceStr: "(Key hilang)", targetStr: tgt.str });
                    });
                    const dz = document.getElementById('dropTgt'); dz.classList.add('filled'); dz.innerText = file.name; dz.title = file.name;
                    if(window.innerWidth <= 900) toggleMenu();
                }
                filteredData = allData; currentPage = 1; renderPage();
                document.getElementById('infoText').innerText = `Total: ${allData.length.toLocaleString()} baris`;
            } catch (err) { alert("Error: " + err.message); } finally { showLoading(false); }
        }, 50);
    }

    function autoResize(el) {
        el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px';
        if (el.scrollHeight < el.parentElement.clientHeight) el.style.height = '100%';
    }

    function renderPage() {
        const tbody = document.getElementById('tbody'); tbody.innerHTML = '';
        const start = (currentPage - 1) * ITEMS_PER_PAGE;
        const pageData = filteredData.slice(start, start + ITEMS_PER_PAGE);
        const frag = document.createDocumentFragment();

        pageData.forEach(row => {
            const tr = document.createElement('tr');
            const val = row.targetStr !== undefined ? row.targetStr : row.sourceStr;
            tr.innerHTML = `
                <td class="cell-guid">${row.keyHex}</td>
                <td class="cell-source">${row.sourceStr || ""}</td>
                <td class="cell-target">
                    <textarea class="edit-box" oninput="handleInput(this, '${row.keyHex}')">${val}</textarea>
                </td>
            `;
            frag.appendChild(tr);
        });
        tbody.appendChild(frag);
        document.getElementById('gridContainer').scrollTop = 0;
        setTimeout(() => document.querySelectorAll('textarea.edit-box').forEach(el => autoResize(el)), 0);
        updatePagination();
    }

    window.handleInput = (el, keyHex) => {
        const item = allData.find(d => d.keyHex === keyHex);
        if(item) item.targetStr = el.value;
        autoResize(el);
    };

    function changePage(delta) {
        const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE) || 1;
        const newPage = currentPage + delta;
        if(newPage > 0 && newPage <= totalPages) { currentPage = newPage; renderPage(); }
    }

    function updatePagination() {
        const totalPages = Math.ceil(filteredData.length / ITEMS_PER_PAGE) || 1;
        document.getElementById('pageInfo').innerText = `Halaman ${currentPage} / ${totalPages}`;
        document.getElementById('btnPrev').disabled = currentPage <= 1;
        document.getElementById('btnNext').disabled = currentPage >= totalPages;
    }

    let searchTimer;
    function handleSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            filteredData = !term ? allData : allData.filter(i => 
                (i.sourceStr && i.sourceStr.toLowerCase().includes(term)) ||
                (i.targetStr && i.targetStr.toLowerCase().includes(term)) ||
                (i.keyHex.toLowerCase().includes(term))
            );
            currentPage = 1; renderPage();
        }, 300);
    }

    function saveTargetFile() {
        if(allData.length === 0) return alert("Kosong!"); showLoading(true);
        setTimeout(() => {
            let strBytes = 0; allData.forEach(r => strBytes += (r.targetStr || r.sourceStr || "").length * 2);
            const totalSize = 17 + (allData.length * 12) + strBytes;
            const buffer = new ArrayBuffer(totalSize); const view = new DataView(buffer); let offset = 0;
            const magic = "STBL"; for(let i=0; i<4; i++) view.setUint8(i, magic.charCodeAt(i)); offset+=4;
            view.setUint8(offset, 2); offset+=1; view.setUint16(offset, 0, true); offset+=2; 
            view.setUint32(offset, allData.length, true); offset+=4; view.setUint32(offset, 0, true); offset+=4; view.setUint16(offset, 0, true); offset+=2; 
            allData.forEach(row => {
                const txt = row.targetStr !== undefined ? row.targetStr : (row.sourceStr || "");
                view.setBigUint64(offset, row.keyBig, true); offset+=8; view.setUint32(offset, txt.length, true); offset+=4;
                for(let i=0; i<txt.length; i++) { view.setUint16(offset, txt.charCodeAt(i), true); offset+=2; }
            });
            const blob = new Blob([buffer], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob); const a = document.createElement('a');
            a.href = url; a.download = "Translated_Strings.stbl"; a.click(); showLoading(false);
        }, 50);
    }
</script>

</body>
</html>
