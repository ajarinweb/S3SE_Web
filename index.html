<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3SE Web Editor</title>
    <style>
        /* --- 1. WARNA & TEMA --- */
        :root {
            --primary: #0078d4;
            --bg: #f3f4f6;
            --panel: #ffffff;
            --text: #333333;
            --border: #cccccc;
            --head: #f9f9f9;
        }

        [data-theme="dark"] {
            --primary: #64b5f6;
            --bg: #121212;
            --panel: #1e1e1e;
            --text: #e0e0e0;
            --border: #333333;
            --head: #252525;
        }

        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); color: var(--text);
            margin: 0; padding: 0; height: 100vh; 
            display: flex; flex-direction: column;
        }

        /* --- LAYOUT --- */
        .container { display: flex; flex: 1; overflow: hidden; height: 100%; position: relative; }

        /* SIDEBAR (Panel Kiri) */
        .sidebar { 
            width: 280px; min-width: 280px; 
            background: var(--panel); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 15px; padding: 20px;
            overflow-y: auto; z-index: 50;
            transition: transform 0.2s;
        }

        /* MAIN (Panel Kanan/Tengah) */
        .main { 
            flex: 1; display: flex; flex-direction: column; 
            background: var(--panel); overflow: hidden; position: relative; 
            width: 100%;
        }

        /* HEADER / TOOLBAR */
        .toolbar { 
            padding: 10px 15px; border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; gap: 10px; 
            background: var(--panel); min-height: 55px; z-index: 40;
        }

        /* TOMBOL-TOMBOL */
        button { cursor: pointer; }
        .menu-btn { display: none; background: none; border: none; font-size: 24px; color: var(--text); padding: 0 10px; }
        .theme-btn { background: none; border: 1px solid var(--border); border-radius: 50%; width: 35px; height: 35px; font-size: 18px; margin-left: auto; color: var(--text); display: flex; align-items: center; justify-content: center; }
        .btn-save { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; }

        /* UPLOAD BOX */
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin-bottom: 10px; }
        .card h3 { margin: 0 0 5px 0; font-size: 12px; color: #888; text-transform: uppercase; }
        .drop-box { 
            border: 2px dashed #aaa; padding: 15px; text-align: center; border-radius: 5px; 
            cursor: pointer; font-size: 13px; color: #666; background: rgba(0,0,0,0.02);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .drop-box:hover { border-color: var(--primary); color: var(--primary); }
        .drop-box.filled { background: rgba(0, 120, 212, 0.1); border-style: solid; border-color: var(--primary); color: var(--primary); font-weight: bold; }

        /* TABEL & EDITOR */
        .grid-wrapper { flex: 1; overflow: auto; position: relative; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; }
        
        thead th { 
            position: sticky; top: 0; background: var(--head); 
            border-bottom: 2px solid var(--border); text-align: left; 
            padding: 10px; color: var(--text); z-index: 10;
        }

        /* KOLOM */
        .col-id { width: 140px; }
        .col-src { width: 40%; }
        .col-tgt { width: auto; }

        td { border-bottom: 1px solid var(--border); vertical-align: top; padding: 0; height: 1px; }

        .cell-id { padding: 10px; font-family: monospace; font-size: 11px; color: #888; background: var(--head); border-right: 1px solid var(--border); word-break: break-all; height: 100%; }
        .cell-src { padding: 10px; background: var(--panel); white-space: pre-wrap; word-wrap: break-word; border-right: 1px solid var(--border); height: 100%; color: var(--text); }
        .cell-tgt { padding: 0; background: var(--panel); height: 100%; }

        /* TEXTAREA (Auto Height Fix) */
        textarea.edit-box {
            width: 100%; height: 100%; min-height: 45px;
            border: none; padding: 10px; resize: none; 
            font-family: inherit; font-size: 14px; line-height: 1.5;
            background: transparent; color: var(--text); outline: none; display: block;
        }
        textarea.edit-box:focus { background: rgba(0,120,212,0.05); box-shadow: inset 3px 0 0 var(--primary); }

        /* PAGINATION */
        .pagination { padding: 10px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--panel); font-size: 13px; color: #888; }
        .btn-page { padding: 5px 10px; border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 4px; }

        /* LOADING & OVERLAY */
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.6); color: white; display: none; align-items: center; justify-content: center; z-index: 999; font-weight: bold; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 45; }

        /* RESPONSIVE (HP) */
        @media (max-width: 800px) {
            .sidebar { 
                position: fixed; top: 0; bottom: 0; left: 0; 
                transform: translateX(-100%); /* Sembunyi */
                box-shadow: 2px 0 10px rgba(0,0,0,0.3); 
            }
            .sidebar.active { transform: translateX(0); } /* Muncul */
            
            .menu-btn { display: block; } /* Tombol Menu Muncul */
            #overlay.active { display: block; } /* Layar hitam muncul */
            
            .col-id { display: none; } /* Hide ID di HP */
            .col-src { width: 40%; }
        }
    </style>
</head>
<body>

<div id="loading">MEMPROSES...</div>
<div id="overlay" onclick="toggleMenu()"></div>

<div class="container">
    <div class="sidebar" id="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h2 style="margin:0; font-size:18px;">S3SE Web</h2>
            <button onclick="toggleMenu()" style="background:none; border:none; font-size:24px; color:var(--text); cursor:pointer;" class="close-btn">&times;</button>
        </div>

        <div class="card">
            <h3>1. File Sumber (Asli)</h3>
            <div class="drop-box" id="dropSrc" onclick="document.getElementById('fSrc').click()">Klik Upload .STBL</div>
            <input type="file" id="fSrc" hidden onchange="load('src', this.files[0])">
        </div>
        <div class="card">
            <h3>2. File Target (Terjemahan)</h3>
            <div class="drop-box" id="dropTgt" onclick="document.getElementById('fTgt').click()">Klik Upload .STBL</div>
            <input type="file" id="fTgt" hidden onchange="load('tgt', this.files[0])">
        </div>
        <div style="margin-top:auto; font-size:12px; color:#888;" id="status">Siap.</div>
    </div>

    <div class="main">
        <div class="toolbar">
            <button class="menu-btn" onclick="toggleMenu()">☰</button>
            <button class="btn-save" onclick="save()">💾 Simpan</button>
            <input type="text" id="search" placeholder="Cari..." onkeyup="filter()" style="padding:8px; border:1px solid #ccc; border-radius:4px; width:150px;">
            <button class="theme-btn" onclick="theme()" title="Ubah Tema">🌙</button>
        </div>

        <div class="grid-wrapper" id="gridWrap">
            <table id="grid">
                <thead>
                    <tr><th class="col-id">ID</th><th class="col-src">Sumber</th><th class="col-tgt">Terjemahan</th></tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <div class="pagination">
            <button class="btn-page" onclick="nav(-1)" id="bPrev">❮</button>
            <span id="pgInfo">Hal 1</span>
            <button class="btn-page" onclick="nav(1)" id="bNext">❯</button>
        </div>
    </div>
</div>

<script>
    // --- SETUP AWAL ---
    let db = [], view = [], page = 1;
    const LIMIT = 50;

    // Load Tema
    if(localStorage.getItem('theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.querySelector('.theme-btn').innerText = '☀️';
    }

    // --- FUNGSI UTAMA ---
    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function theme() {
        const b = document.body;
        const btn = document.querySelector('.theme-btn');
        if(b.getAttribute('data-theme') === 'dark') {
            b.removeAttribute('data-theme');
            btn.innerText = '🌙';
            localStorage.setItem('theme', 'light');
        } else {
            b.setAttribute('data-theme', 'dark');
            btn.innerText = '☀️';
            localStorage.setItem('theme', 'dark');
        }
    }

    function showLoad(v) { document.getElementById('loading').style.display = v ? 'flex' : 'none'; }

    // --- FILE PARSER ---
    function parse(buf) {
        const v = new DataView(buf);
        const dec = new TextDecoder("utf-16le");
        try { if(new TextDecoder().decode(buf.slice(0,4)) !== "STBL") throw 1; } catch(e){ throw "Bukan STBL!"; }
        
        const count = v.getUint32(7, true);
        let off = 17, arr = [];
        for(let i=0; i<count; i++) {
            if(off >= buf.byteLength) break;
            const k = v.getBigUint64(off, true); off+=8;
            const kHex = "0x"+k.toString(16).toUpperCase().padStart(16,'0');
            const len = v.getUint32(off, true); off+=4;
            const str = dec.decode(buf.slice(off, off+(len*2))); off+=(len*2);
            arr.push({k, kHex, str});
        }
        return arr;
    }

    async function load(mode, f) {
        if(!f) return; showLoad(true);
        setTimeout(async()=>{
            try {
                const b = await f.arrayBuffer();
                const res = parse(b);
                if(mode==='src'){
                    if(db.length==0) db = res.map(x=>({...x, s:x.str, t:""}));
                    else res.forEach(x=>{ let d=db.find(i=>i.k===x.k); if(d) d.s=x.str; else db.push({...x, s:x.str, t:""}); });
                    document.getElementById('dropSrc').innerText = f.name; document.getElementById('dropSrc').classList.add('filled');
                    if(window.innerWidth <= 800) toggleMenu(); // Tutup menu di HP
                } else {
                    if(db.length==0) db = res.map(x=>({...x, s:"", t:x.str}));
                    else res.forEach(x=>{ let d=db.find(i=>i.k===x.k); if(d) d.t=x.str; else db.push({...x, s:"MISSING", t:x.str}); });
                    document.getElementById('dropTgt').innerText = f.name; document.getElementById('dropTgt').classList.add('filled');
                    if(window.innerWidth <= 800) toggleMenu();
                }
                view=db; page=1; render();
                document.getElementById('status').innerText = `Total: ${db.length}`;
            } catch(e){ alert(e); } finally { showLoad(false); }
        }, 50);
    }

    // --- AUTO RESIZE TEXTAREA (Script Favorit Kamu) ---
    function autoResize(el) {
        el.style.height = 'auto'; 
        el.style.height = el.scrollHeight + 'px';
        // Fallback: Jika konten lebih pendek dari cell, biarkan CSS height:100% bekerja
        if(el.scrollHeight < el.parentElement.clientHeight) el.style.height = '100%';
    }

    function render() {
        const tb = document.getElementById('tbody'); tb.innerHTML = "";
        const start = (page-1)*LIMIT;
        const sub = view.slice(start, start+LIMIT);
        
        sub.forEach(r => {
            const tr = document.createElement('tr');
            const val = r.t !== undefined ? r.t : r.s;
            tr.innerHTML = `
                <td class="cell-id">${r.kHex}</td>
                <td class="cell-src">${r.s||""}</td>
                <td class="cell-tgt"><textarea class="edit-box" oninput="upd('${r.kHex}', this)">${val}</textarea></td>
            `;
            tb.appendChild(tr);
        });
        document.getElementById('gridWrap').scrollTop = 0;
        
        // Trigger resize
        setTimeout(() => document.querySelectorAll('textarea').forEach(el => autoResize(el)), 0);
        updateNav();
    }

    window.upd = (k, el) => {
        let i = db.find(x=>x.kHex===k); if(i) i.t=el.value;
        autoResize(el);
    }

    function updateNav() {
        const max = Math.ceil(view.length/LIMIT)||1;
        document.getElementById('pgInfo').innerText = `Hal ${page} / ${max}`;
        document.getElementById('bPrev').disabled = page<=1;
        document.getElementById('bNext').disabled = page>=max;
    }

    function nav(d) {
        const max = Math.ceil(view.length/LIMIT)||1;
        const n = page+d;
        if(n>0 && n<=max) { page=n; render(); }
    }

    let tmr;
    function filter() {
        clearTimeout(tmr);
        tmr = setTimeout(()=>{
            const q = document.getElementById('search').value.toLowerCase();
            view = !q ? db : db.filter(x=>(x.s||"").toLowerCase().includes(q) || (x.t||"").toLowerCase().includes(q));
            page=1; render();
        },300);
    }

    function save() {
        if(db.length==0) return alert("Kosong!"); showLoad(true);
        setTimeout(()=>{
            let sz = 17 + (db.length*12);
            db.forEach(x=> sz += (x.t || x.s || "").length*2);
            const b = new ArrayBuffer(sz), v = new DataView(b);
            let o=0; "STBL".split('').forEach(c=>v.setUint8(o++, c.charCodeAt(0)));
            v.setUint8(o++, 2); v.setUint16(o++,0,true); v.setUint32(o++,db.length,true); v.setUint32(o++,0,true); v.setUint16(o++,0,true);
            db.forEach(x=>{
                const t = x.t !== undefined ? x.t : (x.s||"");
                v.setBigUint64(o,x.k,true); o+=8; v.setUint32(o,t.length,true); o+=4;
                for(let i=0; i<t.length; i++){ v.setUint16(o, t.charCodeAt(i), true); o+=2; }
            });
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([b],{type:"octet/stream"}));
            a.download = "Terjemahan.stbl"; a.click(); showLoad(false);
        },50);
    }
</script>
</body>
</html>
